# Gives every new herdr (TUI) workspace the same layout herdr-space-template gives
# herdr-app spaces. Linked, not installed: herdr plugin link ~/.config/herdr/plugins-local/space-template
id = "jd.space-template"
name = "space-template"
version = "0.1.0"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]
description = "Lay out new workspaces as two shells on the left and one on the right, all in $HOME."

[[events]]
on = "workspace.created"
command = ["bash", "layout.sh"]
